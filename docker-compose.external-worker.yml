services:
  external-worker:
    build: .
    # Уникальное имя: на NL-сервере рядом живёт воркер MVP-1 с именем
    # oiltech_external_worker. С одинаковыми именами второй не поднялся бы, а
    # пересоздание «не в той папке» погасило бы воркер заказчика.
    container_name: oiltech_agents_external_worker
    restart: unless-stopped
    env_file:
      - .env.external-worker
    environment:
      PYTHONUNBUFFERED: "1"
      # Агентам сейчас нужен только радар (ИИ): сбор источников ведёт MVP-1, и воркер
      # агентов с очередями fetch/playwright забирал бы хвосты сбора из дампа MVP-1.
      EXTERNAL_WORKER_QUEUES: ${EXTERNAL_WORKER_QUEUES:-external-ai}
      EXTERNAL_WORKER_CAPABILITIES: ${EXTERNAL_WORKER_CAPABILITIES:-openai}
    command: ["python", "-m", "oiltech_digest.cli", "-v", "external-worker"]
