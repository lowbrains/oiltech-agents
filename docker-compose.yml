# Агентная ветвь живёт на том же сервере, что MVP-1, поэтому здесь всё своё: имя
# проекта (сети и тома получают префикс oiltech-agents_), контейнеры oiltech_agents_*,
# порты, отдельный экземпляр Postgres с базой oiltech_agents. Общая база — это
# ровно то, от чего уходили: два bootstrap по одной схеме, и 17.09 bootstrap уже
# ловил дедлок с живым oiltech_tasks на background_jobs.
# Своего Caddy нет: поддомен обслуживает Caddy MVP-1 — см. docker-compose.server.yml.
name: oiltech-agents

services:
  db:
    image: postgres:16
    container_name: oiltech_agents_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oiltech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oiltech_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-oiltech_agents}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oiltech} -d ${POSTGRES_DB:-oiltech_agents}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bootstrap:
    build: .
    container_name: oiltech_agents_bootstrap
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oiltech}:${POSTGRES_PASSWORD:-oiltech_local_dev}@db:5432/${POSTGRES_DB:-oiltech_agents}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command:
      [
        "sh",
        "-c",
        "python -m oiltech_digest.cli init-db && python -m oiltech_digest.cli seed-sources && python -m oiltech_digest.cli seed-tags && python -m oiltech_digest.cli seed-scoring && (python -m oiltech_digest.cli apply-source-overrides || true)"
      ]
    restart: "no"

  app:
    build: .
    container_name: oiltech_agents_app
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oiltech}:${POSTGRES_PASSWORD:-oiltech_local_dev}@db:5432/${POSTGRES_DB:-oiltech_agents}
      PYTHONUNBUFFERED: "1"
      BACKGROUND_JOB_INLINE: "0"
      DIGEST_BRANDING_PATH: /app/branding/digest_branding.json
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ./BACKLOG.md:/app/BACKLOG.md
      - exports:/app/exports
      - branding:/app/branding
      - documents:/data/documents
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  tasks:
    build: .
    container_name: oiltech_agents_tasks
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oiltech}:${POSTGRES_PASSWORD:-oiltech_local_dev}@db:5432/${POSTGRES_DB:-oiltech_agents}
      PYTHONUNBUFFERED: "1"
      BACKGROUND_JOB_INLINE: "0"
      TASKS_APP_MODE: "1"
      DIGEST_BRANDING_PATH: /app/branding/digest_branding.json
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:8110:8000"
    volumes:
      - ./BACKLOG.md:/app/BACKLOG.md
      - exports:/app/exports
      - branding:/app/branding
      - documents:/data/documents
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/tasks', timeout=5).read()\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    container_name: oiltech_agents_worker
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oiltech}:${POSTGRES_PASSWORD:-oiltech_local_dev}@db:5432/${POSTGRES_DB:-oiltech_agents}
      PYTHONUNBUFFERED: "1"
      BACKGROUND_JOB_INLINE: "0"
      BACKGROUND_JOB_POLL_SECONDS: ${BACKGROUND_JOB_POLL_SECONDS:-2}
      BACKGROUND_JOB_STALE_MINUTES: ${BACKGROUND_JOB_STALE_MINUTES:-60}
      BACKGROUND_JOB_QUEUES: default,ai
      SKIP_BOOTSTRAP: "1"
      DIGEST_BRANDING_PATH: /app/branding/digest_branding.json
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: ["python", "-m", "oiltech_digest.cli", "-v", "jobs-worker"]
    volumes:
      - exports:/app/exports
      - branding:/app/branding
      - documents:/data/documents
    restart: unless-stopped

  playwright-worker:
    build: .
    container_name: oiltech_agents_playwright_worker
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oiltech}:${POSTGRES_PASSWORD:-oiltech_local_dev}@db:5432/${POSTGRES_DB:-oiltech_agents}
      PYTHONUNBUFFERED: "1"
      BACKGROUND_JOB_INLINE: "0"
      BACKGROUND_JOB_POLL_SECONDS: ${PLAYWRIGHT_JOB_POLL_SECONDS:-3}
      BACKGROUND_JOB_STALE_MINUTES: ${BACKGROUND_JOB_STALE_MINUTES:-60}
      BACKGROUND_JOB_QUEUES: playwright
      SKIP_BOOTSTRAP: "1"
      DIGEST_BRANDING_PATH: /app/branding/digest_branding.json
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: ["python", "-m", "oiltech_digest.cli", "-v", "jobs-worker"]
    volumes:
      - exports:/app/exports
      - branding:/app/branding
      - documents:/data/documents
    restart: unless-stopped

  scheduler:
    build: .
    container_name: oiltech_agents_scheduler
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oiltech}:${POSTGRES_PASSWORD:-oiltech_local_dev}@db:5432/${POSTGRES_DB:-oiltech_agents}
      PYTHONUNBUFFERED: "1"
      CYCLE_INTERVAL_SECONDS: ${CYCLE_INTERVAL_SECONDS:-21600}
      RUN_DISCOVER_ON_START: ${RUN_DISCOVER_ON_START:-1}
      DISCOVER_EVERY_CYCLES: ${DISCOVER_EVERY_CYCLES:-24}
      RUN_MAINTENANCE_ON_START: ${RUN_MAINTENANCE_ON_START:-1}
      MAINTENANCE_EVERY_CYCLES: ${MAINTENANCE_EVERY_CYCLES:-24}
      DISCOVER_TIMEOUT: ${DISCOVER_TIMEOUT:-4}
      DISCOVER_WORKERS: ${DISCOVER_WORKERS:-2}
      PARSE_WORKERS: ${PARSE_WORKERS:-3}
      FULL_TEXT_LIMIT: ${FULL_TEXT_LIMIT:-80}
      FULL_TEXT_MIN_CHARS: ${FULL_TEXT_MIN_CHARS:-800}
      AI_PROCESS_LIMIT: ${AI_PROCESS_LIMIT:-50}
      AI_OFFLINE: ${AI_OFFLINE:-0}
      SKIP_BOOTSTRAP: "1"
      HTTP_MIN_INTERVAL_SECONDS: ${HTTP_MIN_INTERVAL_SECONDS:-1.5}
      HTTP_JITTER_SECONDS: ${HTTP_JITTER_SECONDS:-0.4}
      HTTP_BLOCK_COOLDOWN_SECONDS: ${HTTP_BLOCK_COOLDOWN_SECONDS:-900}
      REQUEST_ARTICLE_LIMIT: ${REQUEST_ARTICLE_LIMIT:-6}
      SOURCE_DISCOVERY_MODE: ${SOURCE_DISCOVERY_MODE:-plan}
      SOURCE_DISCOVERY_MAX_ITERATIONS: ${SOURCE_DISCOVERY_MAX_ITERATIONS:-3}
      SOURCE_DISCOVERY_MAX_DAILY_LOOP_RUNS: ${SOURCE_DISCOVERY_MAX_DAILY_LOOP_RUNS:-4}
      SOURCE_DISCOVERY_MAX_DAILY_CANDIDATES: ${SOURCE_DISCOVERY_MAX_DAILY_CANDIDATES:-100}
      SOURCE_DISCOVERY_MAX_DAILY_EVALUATIONS: ${SOURCE_DISCOVERY_MAX_DAILY_EVALUATIONS:-100}
      SIGNAL_DISCOVERY_DAILY_ENABLED: ${SIGNAL_DISCOVERY_DAILY_ENABLED:-1}
      SIGNAL_DISCOVERY_DAILY_LOOKBACK_HOURS: ${SIGNAL_DISCOVERY_DAILY_LOOKBACK_HOURS:-24}
      SIGNAL_DISCOVERY_DAYS: ${SIGNAL_DISCOVERY_DAYS:-14}
      SIGNAL_DISCOVERY_LIMIT: ${SIGNAL_DISCOVERY_LIMIT:-120}
      SIGNAL_DISCOVERY_MIN_SCORE: ${SIGNAL_DISCOVERY_MIN_SCORE:-40}
      SIGNAL_DISCOVERY_MAX_SIGNALS: ${SIGNAL_DISCOVERY_MAX_SIGNALS:-20}
      SIGNAL_DISCOVERY_WEB_QUERY_LIMIT: ${SIGNAL_DISCOVERY_WEB_QUERY_LIMIT:-8}
      DIGEST_BRANDING_PATH: /app/branding/digest_branding.json
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: ["./scripts/docker-scheduler.sh"]
    volumes:
      - exports:/app/exports
      - branding:/app/branding
      - documents:/data/documents
    restart: unless-stopped

  docs:
    image: squidfunk/mkdocs-material:9
    container_name: oiltech_agents_docs
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:8000"
    volumes:
      - ./docs/help:/docs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/help/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oiltech}:${POSTGRES_PASSWORD:-oiltech_local_dev}@db:5432/${POSTGRES_DB:-oiltech_agents}
      PYTHONUNBUFFERED: "1"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: ["python", "-m", "pytest"]
    volumes:
      - .:/app
      - exports:/app/exports
    profiles:
      - test

volumes:
  pgdata:
  exports:
  # Брендинг дайджеста — ОБЩИЙ для админки и воркеров выгрузки. Именованный том,
  # а не файл в репозитории: (1) правки видны всем контейнерам сразу, (2) деплой
  # `git reset --hard` + `build` их больше не затирает.
  branding:
  # Оригиналы загруженных документов. Общий том, а не каталог в контейнере: пишет
  # `app`, читает разбор — состояние в этой системе делят пять процессов, и правки
  # в «свою копию» файла тут уже приводили к дефекту (брендинг, 03.08).
  # ⚠️ В pg_dump этот том НЕ попадает: расширение задачи бэкапа — отдельный тикет #34.
  documents:
