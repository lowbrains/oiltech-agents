# Только для сервера: `docker compose -f docker-compose.yml -f docker-compose.server.yml …`
#
# Поддомен агентов обслуживает Caddy MVP-1 (один сервер — одни порты 80/443). Чтобы
# он достал приложение агентов, agents-app подключается ещё и к сети MVP-1.
# Имена в этой сети обязаны быть уникальными: «app» и «db» там уже заняты MVP-1.
# Локально этой сети нет — поэтому подключение здесь, а не в docker-compose.yml.
services:
  agents-app:
    networks:
      - default
      - mvp1

networks:
  mvp1:
    name: oiltech-digest_default
    external: true
